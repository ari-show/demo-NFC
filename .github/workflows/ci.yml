name: CI

# pull_request_target / workflow_run は使わない。
# fork からの PR は secrets 無し・読み取り専用トークンで実行される。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ワークフロー全体の GITHUB_TOKEN 権限を最小化
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # 外部 action は全て commit SHA 固定(タグは付け替え可能なため)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GITHUB_TOKEN を .git/config に残さない
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # PR 経由のキャッシュ汚染を避けるため、キャッシュは使わない
          enable-cache: false

      - name: Install dependencies (lockfile as-is)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff format
        run: uv run --frozen ruff format --check .

      - name: Pytest
        run: uv run --frozen pytest
