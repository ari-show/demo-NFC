name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # uv itself is a single binary; Python is fetched by uv from .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (dev only, lockfile as-is)
        run: uv sync --frozen --only-dev

      - name: Ruff lint
        run: uv run --frozen --only-dev ruff check .

      - name: Ruff format
        run: uv run --frozen --only-dev ruff format --check .

      - name: Pytest
        run: uv run --frozen --only-dev pytest
